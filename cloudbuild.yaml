# Google Cloud Build config for webship-js.
#
# Runs the full BDD suite inside a Playwright-prepped container on Google's
# managed builder pool. For the free tier and the prices, see the Cloud Build
# pricing page: they change over time. The image is the one of the Playwright
# the install brings; `npx playwright install` gets the browser of a newer
# Playwright release when there is one.
#
# Setup (full walkthrough in docs/16-ci-cd.md → "Google Cloud Build"):
#   1. console.cloud.google.com → create project → enable Cloud Build API.
#   2. Cloud Build → Triggers → Connect repository → GitHub OAuth.
#   3. Add trigger pointing at this file on branch ^2\.0\.x$.

substitutions:
  _BRANCH_NAME: '2.0.x'
  _ARTIFACT_BUCKET: 'webship-js-reports'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_STANDARD_2'

timeout: '1800s'

steps:
  - id: install-and-test
    name: 'mcr.microsoft.com/playwright:v1.65.1-noble'
    entrypoint: 'bash'
    env:
      - 'FORCE_COLOR=1'
      - 'LAUNCH_URL=http://localhost:8080'
    args:
      - '-c'
      - |
        set -euo pipefail
        node --version
        npm --version
        npm install
        npx playwright install --with-deps chromium
        nohup npm start > /tmp/srv.log 2>&1 &
        sleep 3
        curl -sf http://localhost:8080/ > /dev/null
        # A failing suite must not stop the build before the report is kept:
        # the result is checked by the last step.
        npm test || touch /workspace/.tests-failed

  # Cloud Build uploads the files of `artifacts:` only when every step
  # succeeds, so the report, the screenshots and the videos are copied here,
  # passed or failed.
  - id: keep-report
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        for dir in tests/reports screenshots videos; do
          if [ -d "$$dir" ]; then gsutil -m cp -r "$$dir" "gs://${_ARTIFACT_BUCKET}/$BUILD_ID/"; fi
        done

  - id: test-result
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f /workspace/.tests-failed ]; then echo "The suite failed: see the report in gs://${_ARTIFACT_BUCKET}/$BUILD_ID/"; exit 1; fi
