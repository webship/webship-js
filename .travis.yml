language: node_js
os: linux
dist: jammy

node_js:
  - "24"

env:
  global:
    - FORCE_COLOR=1
    - LAUNCH_URL=http://localhost:8080

cache:
  npm: true
  directories:
    - $HOME/.cache/ms-playwright

branches:
  only:
    - 2.0.x
    - /^2\.0\..*$/

install:
  - npm install
  - npx playwright install --with-deps chromium

before_script:
  - npm start &
  - sleep 3
  - curl -sf http://localhost:8080/ > /dev/null

script:
  - npm test

# Travis CI keeps no build artifacts of its own: the report, the screenshots
# and the videos (tests/reports/, screenshots/, videos/) stay in the build
# log only. To keep them, upload them to storage of your own in an
# after_script step, or use another provider of docs/16-ci-cd.md.

notifications:
  email:
    on_success: never
    on_failure: change
