name: Github Actions

on:
  push:
    branches: [2.0.x]
  pull_request:
    branches: [2.0.x]
  workflow_dispatch: {}

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 24: the lowest Node.js webship-js's engines field accepts (">= 24.0").
        # 26: the latest LTS release.
        node: ['24', '26']

    env:
      TEST_BASE_URL: http://localhost:8080
      FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Check the HTML report
        run: npm run test:report

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check that a dry run prints no line for each skipped step
        run: npm run test:dry-run

      - name: Check that the relative API base URL follows the launch URL
        run: npm run test:api-launch-url

      - name: Check that a pack's step sets a header for the built-in API steps
        run: npm run test:api-set-header

      - name: Check the step examples and the feature steps
        run: npm run test:examples

      - name: Check the step packs on npm beside this webship-js
        run: npm run test:packs

      - name: Check that a wait runs for the time the scenario gives it
        run: npm run test:time-limit

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Check that the print steps attach what they print to the report
        run: npm run test:attachments

      - name: Check that each JavaScript-error check counts its own kind
        run: npm run test:js-errors

      - name: Check that only a failed step leaves a failure screenshot
        run: npm run test:screenshots

      - name: Check that a step reads a file from the tests/assets of the project
        run: npm run test:assets

      - name: Check that a configuration with only the launch URL runs
        run: npm run test:config

      - name: Check the HTML report built at the end of a run
        run: npm run test:exit-report

      - name: Check that every step and tag reads one breakpoint registry
        run: npm run test:breakpoints

      - name: Check that a replaced browser context keeps what the scenario set up
        run: npm run test:context

      - name: Check the video files of the three recording modes
        run: npm run test:video

      - name: Check that a project extends the World and settles its own steps
        run: npm run test:world

      - name: Check the smart waits under a fake clock
        run: npm run test:clock

      - name: Check that a project step with a page-changing verb is followed by the settle
        run: npm run test:settle-verbs

      - name: Check that the settle waits for the timers due within its budget, and only those
        run: npm run test:timers

      - name: Check that a page load aborted by a network change is loaded once more
        run: npm run test:network-changed

      - name: Check that a home page which rewrites its own address is the homepage
        run: npm run test:homepage-address

      - name: Check that a form posted to its own site carries the page's Origin
        run: npm run test:same-origin

      - name: Start virtual server
        run: npm start &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null "$TEST_BASE_URL/" && exit 0
            sleep 1
          done
          echo "The server did not answer on $TEST_BASE_URL in 30 seconds" >&2
          exit 1

      - name: Check the failures that must fail and their messages
        run: npm run test:must-fail

      - name: Run tests
        run: npm test

      - name: Check the scaffold of a new project
        run: npm run test:scaffold

      - name: Upload the report, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: |
            tests/reports/
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
