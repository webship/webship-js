image: node:24

variables:
  FORCE_COLOR: "1"

before_script:
  - npm install
  - npx playwright install --with-deps chromium

stages:
  - test

webship-js-test:
  stage: test
  script:
    - npm start &
    - sleep 3
    - npm test
  artifacts:
    name: cucumber-report
    when: always
    expire_in: 14 days
    paths:
      - tests/reports/
      - screenshots/
      - videos/

  only:
    refs:
      - tags
      - branches
