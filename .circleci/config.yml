version: 2.1

defaults: &defaults
  docker:
    - image: cimg/node:20.20
  environment:
    FORCE_COLOR: "1"

jobs:
  webship-js-testing:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: npm install
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: Start virtual server
          command: npm start
          background: true
      - run:
          name: Wait for server
          command: sleep 3
      - run:
          name: Test
          command: npm test

workflows:
  version: 2
  webship-js-workflow:
    jobs:
      - webship-js-testing:
          filters:
            tags:
              only: /^2.0.*/
            branches:
              only: /^2.0.x/
