<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessibility Demo</title>
</head>
<body>
  <header>
    <nav aria-label="Primary"><ul><li><a href="/">Home</a></li></ul></nav>
  </header>
  <main>
    <h1>Accessibility Demo</h1>
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="Pixel">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="" role="presentation">
    <form>
      <label for="email">Email</label>
      <input id="email" type="email" name="email">

      <label for="message">Message</label>
      <textarea id="message" name="message"></textarea>

      <label>
        <input type="checkbox" name="agree"> I agree
      </label>

      <button type="submit">Submit</button>
    </form>
  </main>
  <!-- Hidden from assistive technology: a closed overlay. Nothing in here is
       reachable, so no accessibility probe should report it. -->
  <div class="scrim" aria-hidden="true" style="display:none">
    <button type="button" tabindex="-1"></button>
    <a href="/closed"></a>
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==">
    <input type="text" name="scrim-field">
  </div>
  <footer><small>&copy; 2026</small></footer>
</body>
</html>
