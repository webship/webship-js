<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible page with a legacy widget</title>
  <style>
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { position: static; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header>
    <nav aria-label="Primary"><ul><li><a href="/">Home</a></li></ul></nav>
  </header>
  <main id="main-content">
    <h1>Accessible page with a legacy widget</h1>
    <p>The main content of this page is accessible.</p>
    <form>
      <label for="search">Search</label>
      <input id="search" type="search" name="search">
      <button type="submit">Search</button>
    </form>
  </main>
  <!-- An embedded widget the page does not control: an image without a text
       alternative and a field without a label. -->
  <aside class="legacy-widget" aria-label="Legacy widget">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==">
    <input type="text" name="legacy-code">
  </aside>
  <footer><small>&copy; 2026</small></footer>
</body>
</html>
