<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Iframes</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    iframe { display: block; width: 480px; height: 220px; border: 2px solid #333; margin: 10px 0 20px; }
  </style>
</head>
<body>
  <h1>Iframes</h1>
  <p id="root-note">This text is in the root document</p>

  <h2>Order</h2>
  <iframe id="order-frame" class="order-widget" name="order" title="Order form" src="iframe-order.html"></iframe>

  <h2>Newsletter</h2>
  <iframe id="newsletter-frame" class="newsletter-widget" name="newsletter" title="Newsletter form" src="iframe-newsletter.html"></iframe>
</body>
</html>
