<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewport size</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    #viewport-size { font-size: 20px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>
  <h1>Viewport size</h1>
  <p id="viewport-size"></p>
  <script>
    function showViewportSize() {
      document.getElementById('viewport-size').textContent =
        'Viewport is ' + window.innerWidth + ' by ' + window.innerHeight;
    }
    window.addEventListener('resize', showViewportSize);
    showViewportSize();
  </script>
</body>
</html>
