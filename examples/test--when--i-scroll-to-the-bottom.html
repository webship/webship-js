<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>when I scroll to the bottom</title>
  <style>
    .container,
    .container input,
    .container button {
      font-size: 26px;
    }

    .style {
      font-size: 22px;
      line-height: 30px;
      border-width: 1pc;
    }
    
    #complete{
      font-size: 32px;
      line-height: 30px;
    }

  </style>

</head>

<body>
  <h1>scrolling page to the bottom</h1>

  <div id="container">
  
  </div>

  <div id="complete">
  
  </div>
</body>

<script>

  for(var i=0; i<20; i++){
    document.getElementById("container").innerHTML += '<p class="style"> Container #' + i + '</p>';
  }
  document.getElementById("complete").innerHTML += "Scrolling has reached the bottom";
 
</script>
</html>
