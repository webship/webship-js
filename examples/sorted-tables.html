<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sorted tables</title>
</head>
<body>
  <h1>Sorted tables</h1>

  <table id="prices">
    <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Released</th></tr></thead>
    <tbody>
      <tr><td>Cable</td><td>$9.99</td><td>2</td><td>Mar 9, 2026</td></tr>
      <tr><td>keyboard</td><td>$49.99</td><td>10</td><td>Jun 21, 2026</td></tr>
      <tr><td>Monitor</td><td>$900.00</td><td>100</td><td>Nov 17, 2026</td></tr>
      <tr><td>Workstation</td><td>$1,299.00</td><td>1,250</td><td>Dec 1, 2026</td></tr>
    </tbody>
  </table>

  <table id="items">
    <thead><tr><th>Item</th><th>Discount</th></tr></thead>
    <tbody>
      <tr><td>Item 10</td><td>5 %</td></tr>
      <tr><td>Item 2</td><td>12 %</td></tr>
      <tr><td>Item 1</td><td>12 %</td></tr>
    </tbody>
  </table>

  <table id="unsorted">
    <thead><tr><th>Price</th></tr></thead>
    <tbody>
      <tr><td>$49.99</td></tr>
      <tr><td>$9.99</td></tr>
      <tr><td>$900.00</td></tr>
    </tbody>
  </table>
</body>
</html>
