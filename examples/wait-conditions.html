<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wait conditions</title>
</head>
<body>
  <h1>Wait conditions</h1>
  <p>Every button below changes the page two and a half seconds after it is pressed.</p>

  <h2>An element that appears</h2>
  <p><button id="show-notice" type="button">Show notice</button></p>
  <p id="notice" hidden>Notice ready</p>

  <h2>An element that disappears</h2>
  <p><button id="finish-loading" type="button">Finish loading</button></p>
  <p id="spinner">Loading data</p>

  <h2>A step that changes the address and the title</h2>
  <p><button id="next-step" type="button">Go to step 2</button></p>
  <p id="step">Step 1</p>

  <h2>A list that fills up</h2>
  <p>
    <button id="load-results" type="button">Load results</button>
    <button id="load-more" type="button">Load more</button>
  </p>
  <ul id="results"></ul>

  <script>
    var DELAY = 2500;

    document.getElementById('show-notice').addEventListener('click', function () {
      setTimeout(function () {
        document.getElementById('notice').hidden = false;
      }, DELAY);
    });

    document.getElementById('finish-loading').addEventListener('click', function () {
      setTimeout(function () {
        var spinner = document.getElementById('spinner');
        spinner.parentNode.removeChild(spinner);
      }, DELAY);
    });

    document.getElementById('next-step').addEventListener('click', function () {
      setTimeout(function () {
        history.pushState({ step: 2 }, '', '?step=2');
        document.title = 'Step 2 - Wait conditions';
        document.getElementById('step').textContent = 'Step 2';
      }, DELAY);
    });

    function addResults(count) {
      setTimeout(function () {
        var list = document.getElementById('results');
        for (var i = 0; i < count; i++) {
          var li = document.createElement('li');
          li.className = 'result';
          li.textContent = 'Result ' + (list.children.length + 1);
          list.appendChild(li);
        }
      }, DELAY);
    }
    document.getElementById('load-results').addEventListener('click', function () { addResults(3); });
    document.getElementById('load-more').addEventListener('click', function () { addResults(2); });
  </script>
</body>
</html>
